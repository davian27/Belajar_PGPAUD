<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 450" width="100%" height="100%">
  <!-- Background base -->
  <rect width="400" height="450" fill="#FFFFFF"/>

  <!-- Line Art Group - Pure Black Outlines with White Fill for Easy Coloring -->
  <g fill="#FFFFFF" stroke="#000000" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <!-- Peacock Feathers Fan Top -->
    <path d="M 200 240 Q 60 50 40 180 Q 20 280 200 250 Z" />
    <path d="M 200 240 Q 340 50 360 180 Q 380 280 200 250 Z" />
    <path d="M 200 240 Q 80 10 200 30 Q 320 10 200 240 Z" />

    <!-- Feather Circles -->
    <circle cx="100" cy="110" r="18"/>
    <circle cx="100" cy="110" r="8"/>
    <circle cx="160" cy="70" r="20"/>
    <circle cx="160" cy="70" r="9"/>
    <circle cx="200" cy="55" r="22"/>
    <circle cx="200" cy="55" r="10"/>
    <circle cx="240" cy="70" r="20"/>
    <circle cx="240" cy="70" r="9"/>
    <circle cx="300" cy="110" r="18"/>
    <circle cx="300" cy="110" r="8"/>

    <!-- Lion Mane Outer -->
    <path d="M 110 180 C 70 200 60 260 90 300 C 60 320 70 380 120 390 C 150 430 250 430 280 390 C 330 380 340 320 310 300 C 340 260 330 200 290 180 C 270 140 130 140 110 180 Z" />

    <!-- Crown / Headband -->
    <path d="M 130 175 L 200 150 L 270 175 L 250 200 L 150 200 Z" />
    <circle cx="200" cy="175" r="10" />

    <!-- Face Base -->
    <ellipse cx="200" cy="260" rx="90" ry="80" />
    <ellipse cx="200" cy="285" rx="50" ry="40" />

    <!-- Snout / Nose -->
    <path d="M 185 260 Q 200 250 215 260 Q 200 280 185 260 Z" />

    <!-- Eyes -->
    <ellipse cx="160" cy="235" rx="16" ry="22" />
    <circle cx="155" cy="227" r="7" />
    <ellipse cx="240" cy="235" rx="16" ry="22" />
    <circle cx="235" cy="227" r="7" />

    <!-- Cheeks -->
    <ellipse cx="140" cy="265" rx="14" ry="9" />
    <ellipse cx="260" cy="265" rx="14" ry="9" />

    <!-- Smile -->
    <path d="M 175 285 Q 200 320 225 285" fill="none" stroke="#000000" stroke-width="5"/>
    <path d="M 188 298 Q 200 318 212 298 Z" />

    <!-- Teeth -->
    <polygon points="172,282 178,294 184,282" />
    <polygon points="216,282 222,294 228,282" />

    <!-- Paws -->
    <ellipse cx="110" cy="350" rx="22" ry="26" />
    <ellipse cx="290" cy="330" rx="24" ry="28" />
  </g>
</svg>
